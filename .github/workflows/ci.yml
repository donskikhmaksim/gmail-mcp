name: CI

# Гоняет ВЕСЬ `npm test` на каждый push и pull request.
#
# Зачем отдельным файлом: до 2026-08-06 в CI жили только `guide.yml`
# (сверка GUIDE.md) и `sync-upstream.yml` — то есть `npm test` не запускался
# в CI ВООБЩЕ, и защитная проверка `scripts/test-gate-coverage.mjs` (новый
# write-метод без гейта подтверждения) физически не могла ничего заблокировать,
# хотя её собственный комментарий утверждал обратное. Такая проверка хуже, чем
# никакой: она усыпляет.
#
# `npm test` сам делает сборку первым шагом (см. package.json), поэтому
# отдельного шага `build` здесь нет — но `typecheck` идёт до тестов, чтобы
# ошибка типов давала внятный лог, а не падение первого же .mjs-скрипта.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
