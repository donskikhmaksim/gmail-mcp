name: Typecheck and tests

# The gate-coverage test (scripts/test-gate-coverage.mjs) is what stops a write
# tool from shipping without a consent gate — but until now nothing ran it in
# CI, so it only ever failed on someone's laptop. Same for the SSRF and
# consent-gate suites. Everything below is offline: no network beyond loopback,
# no secrets, no database (Google/Telegram clients and `fetch` are stubbed,
# Postgres is a fake in-memory store) — verified by running the whole suite
# with external DNS/TCP blocked.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Workflow files are parseable
        # Not a formality: .github/workflows/sync-upstream.yml sat
        # unparseable (a backslash line-continuation broke the `run: |`
        # block) from 2026-07-23 until 2026-08-06 — GitHub silently failed
        # EVERY run with "workflow file issue", so fork auto-update never
        # ran once for any self-hoster. One YAML parse catches this
        # immediately.
        run: |
          python3 -m pip install --quiet 'PyYAML>=6,<7'
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              try:
                  yaml.safe_load(p.read_text())
              except yaml.YAMLError as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all workflow files parse")
          PY
